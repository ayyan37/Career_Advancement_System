<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Career Assessment Test</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #eef4ff, #f8fbff);
            color: #172033;
            min-height: 100vh;
        }

        .header {
            padding: 22px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 21px;
            font-weight: 700;
            color: #2563eb;
        }

        .test-label {
            background: #e8f0ff;
            color: #2563eb;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }

        .container {
            width: 90%;
            max-width: 820px;
            margin: 25px auto 60px;
        }

        .top-card {
            background: white;
            border-radius: 22px;
            padding: 28px 32px;
            box-shadow: 0 12px 35px rgba(31, 55, 90, 0.08);
            margin-bottom: 18px;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        #progressText {
            font-size: 14px;
            font-weight: 700;
            color: #2563eb;
        }

        .progress-percent {
            font-size: 13px;
            color: #6b7280;
        }

        .progress-container {
            width: 100%;
            height: 9px;
            background: #e8edf5;
            border-radius: 20px;
            overflow: hidden;
        }

        #progressBar {
            height: 100%;
            width: 6.66%;
            background: linear-gradient(90deg, #2563eb, #4f8cff);
            border-radius: 20px;
            transition: width 0.3s ease;
        }

        .question-card {
            background: white;
            border-radius: 22px;
            padding: 40px;
            box-shadow: 0 12px 35px rgba(31, 55, 90, 0.08);
        }

        .question-number {
            display: inline-block;
            padding: 7px 12px;
            border-radius: 8px;
            background: #eef4ff;
            color: #2563eb;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 18px;
        }

        #question {
            font-size: 25px;
            line-height: 1.35;
            margin: 0 0 28px;
            color: #111827;
        }

        #options {
            display: grid;
            gap: 14px;
        }

        .option {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 17px 18px;
            border: 1.5px solid #e1e6ef;
            border-radius: 13px;
            cursor: pointer;
            transition: all 0.2s ease;
            background: #fff;
            font-size: 15px;
            color: #374151;
        }

        .option:hover {
            border-color: #7da7ff;
            background: #f7faff;
            transform: translateY(-1px);
        }

        .option input {
            width: 18px;
            height: 18px;
            accent-color: #2563eb;
            cursor: pointer;
            flex-shrink: 0;
        }

        .option:has(input:checked) {
            border-color: #2563eb;
            background: #eef4ff;
            color: #1d4ed8;
            font-weight: 600;
            box-shadow: 0 5px 15px rgba(37, 99, 235, 0.08);
        }

        .button-area {
            display: flex;
            justify-content: flex-end;
            margin-top: 30px;
        }

        button {
            border: none;
            padding: 14px 28px;
            border-radius: 11px;
            background: linear-gradient(135deg, #2563eb, #3b82f6);
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 7px 18px rgba(37, 99, 235, 0.22);
            transition: 0.2s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 22px rgba(37, 99, 235, 0.28);
        }

        .note {
            text-align: center;
            margin-top: 18px;
            font-size: 12px;
            color: #8a93a3;
        }

        @media (max-width: 600px) {

            .header {
                padding: 18px 5%;
            }

            .logo {
                font-size: 18px;
            }

            .test-label {
                font-size: 11px;
                padding: 7px 10px;
            }

            .container {
                width: 94%;
                margin-top: 10px;
            }

            .top-card {
                padding: 22px;
                border-radius: 18px;
            }

            .question-card {
                padding: 25px 20px;
                border-radius: 18px;
            }

            #question {
                font-size: 21px;
            }

            .option {
                padding: 15px;
                font-size: 14px;
            }

            button {
                width: 100%;
            }

            .button-area {
                display: block;
            }
        }
    </style>
</head>

<body>

<header class="header">

    <div class="logo">
        CareerPath
    </div>

    <div class="test-label">
        Career Assessment
    </div>

</header>


<div class="container">

    <div class="top-card">

        <div class="progress-info">

            <span id="progressText">
                Question 1 / 15
            </span>

            <span class="progress-percent" id="progressPercent">
                7% Complete
            </span>

        </div>

        <div class="progress-container">

            <div id="progressBar"></div>

        </div>

    </div>


    <div class="question-card">

        <div class="question-number">
            QUESTION
        </div>

        <h1 id="question">
            Loading question...
        </h1>

        <div id="options"></div>

        <div class="button-area">

            <button onclick="nextQuestion()">
                Next Question →
            </button>

        </div>

        <div class="note">
            Choose the option that best matches your interest.
        </div>

    </div>

</div>


<script>

const questions = [

    {
        question: "Which activity do you enjoy the most?",
        options: [
            ["Writing code", "Programming"],
            ["Working with numbers and data", "Data Analytics"],
            ["Creating websites", "Web Development"],
            ["Designing interfaces", "UI/UX Design"]
        ]
    },

    {
        question: "Which subject interests you the most?",
        options: [
            ["Programming", "Programming"],
            ["Statistics", "Data Analytics"],
            ["Web Technologies", "Web Development"],
            ["Graphic Design", "UI/UX Design"]
        ]
    },

    {
        question: "Which area would you like to learn?",
        options: [
            ["Ethical Hacking", "Cyber Security"],
            ["Python Programming", "Programming"],
            ["Data Analysis", "Data Analytics"],
            ["Web Design", "UI/UX Design"]
        ]
    },

    {
        question: "What type of work do you prefer?",
        options: [
            ["Building software", "Programming"],
            ["Analyzing information", "Data Analytics"],
            ["Building websites", "Web Development"],
            ["Creating visual designs", "UI/UX Design"]
        ]
    },

    {
        question: "Which technology interests you most?",
        options: [
            ["Python / Java", "Programming"],
            ["Excel / Power BI", "Data Analytics"],
            ["HTML / CSS / JavaScript", "Web Development"],
            ["Figma / Design Tools", "UI/UX Design"]
        ]
    },

    {
        question: "What do you enjoy solving?",
        options: [
            ["Programming problems", "Programming"],
            ["Data and numerical problems", "Data Analytics"],
            ["Website-related problems", "Web Development"],
            ["Visual and design problems", "UI/UX Design"]
        ]
    },

    {
        question: "Which skill would you like to improve?",
        options: [
            ["Coding", "Programming"],
            ["Data Analysis", "Data Analytics"],
            ["Web Development", "Web Development"],
            ["Creative Design", "UI/UX Design"]
        ]
    },

    {
        question: "Which tool would you like to learn?",
        options: [
            ["Python", "Programming"],
            ["Power BI", "Data Analytics"],
            ["JavaScript", "Web Development"],
            ["Figma", "UI/UX Design"]
        ]
    },

    {
        question: "Which type of project would you prefer?",
        options: [
            ["Software application", "Programming"],
            ["Data dashboard", "Data Analytics"],
            ["Online website", "Web Development"],
            ["Mobile/web interface design", "UI/UX Design"]
        ]
    },

    {
        question: "Which task sounds most interesting?",
        options: [
            ["Writing a program", "Programming"],
            ["Finding patterns in data", "Data Analytics"],
            ["Building a webpage", "Web Development"],
            ["Designing a user interface", "UI/UX Design"]
        ]
    },

    {
        question: "Which career area interests you?",
        options: [
            ["Software Developer", "Programming"],
            ["Data Analyst", "Data Analytics"],
            ["Web Developer", "Web Development"],
            ["UI/UX Designer", "UI/UX Design"]
        ]
    },

    {
        question: "Which type of thinking do you prefer?",
        options: [
            ["Logical thinking", "Programming"],
            ["Analytical thinking", "Data Analytics"],
            ["Technical and creative thinking", "Web Development"],
            ["Visual thinking", "UI/UX Design"]
        ]
    },

    {
        question: "What would you enjoy creating?",
        options: [
            ["Applications", "Programming"],
            ["Reports and dashboards", "Data Analytics"],
            ["Websites", "Web Development"],
            ["Interface designs", "UI/UX Design"]
        ]
    },

    {
        question: "Which activity would you choose for a college project?",
        options: [
            ["Developing an application", "Programming"],
            ["Analyzing a dataset", "Data Analytics"],
            ["Creating a website", "Web Development"],
            ["Designing an app interface", "UI/UX Design"]
        ]
    },

    {
        question: "Which statement describes your interest best?",
        options: [
            ["I like coding and logic", "Programming"],
            ["I like numbers and analysis", "Data Analytics"],
            ["I like websites and technology", "Web Development"],
            ["I like creativity and design", "UI/UX Design"]
        ]
    }

];


let currentQuestion = 0;

let answers = [];


function loadQuestion() {

    const q = questions[currentQuestion];


    document.getElementById("question").innerText =
        q.question;


    document.getElementById("progressText").innerText =
        `Question ${currentQuestion + 1} / ${questions.length}`;


    const percentage =
        Math.round(
            ((currentQuestion + 1) /
            questions.length) * 100
        );


    document.getElementById("progressBar").style.width =
        percentage + "%";


    document.getElementById("progressPercent").innerText =
        percentage + "% Complete";


    const optionsDiv =
        document.getElementById("options");


    optionsDiv.innerHTML = "";


    q.options.forEach(function(option) {

        optionsDiv.innerHTML += `

            <label class="option">

                <input
                    type="radio"
                    name="answer"
                    value="${option[1]}">

                <span>${option[0]}</span>

            </label>

        `;

    });

}


function nextQuestion() {

    const selected =
        document.querySelector(
            'input[name="answer"]:checked'
        );


    if (!selected) {

        alert("Please select an answer.");

        return;

    }


    answers[currentQuestion] =
        selected.value;


    if (currentQuestion < questions.length - 1) {

        currentQuestion++;

        loadQuestion();

    }

    else {

        calculateResult();

    }

}


async function calculateResult() {

    let scores = {

        "Programming": 0,

        "Data Analytics": 0,

        "Web Development": 0,

        "UI/UX Design": 0,

        "Cyber Security": 0

    };


    answers.forEach(function(answer) {

        if (scores.hasOwnProperty(answer)) {

            scores[answer]++;

        }

    });


    let recommendedCareer =
        Object.keys(scores).reduce(function(a, b) {

            return scores[a] > scores[b] ? a : b;

        });


    let totalScore =
        scores[recommendedCareer];


    const studentName =
        sessionStorage.getItem("studentName");


    const studentCourse =
        sessionStorage.getItem("studentCourse");


    const studentInterest =
        sessionStorage.getItem("studentInterest");


    sessionStorage.setItem(
        "answers",
        JSON.stringify(answers)
    );


    sessionStorage.setItem(
        "categoryScores",
        JSON.stringify(scores)
    );


    sessionStorage.setItem(
        "recommendedCareer",
        recommendedCareer
    );


    sessionStorage.setItem(
        "score",
        totalScore
    );


    sessionStorage.setItem(
        "total",
        questions.length
    );


    const resultData = {

        name: studentName,

        course: studentCourse,

        interest: studentInterest,

        answers: answers,

        categoryScores: scores,

        recommendedCareer: recommendedCareer,

        score: totalScore,

        totalQuestions: questions.length,

        createdAt: new Date().toISOString()

    };


    try {

        const response =
            await fetch("/save_result", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify(resultData)

            });


        const result =
            await response.json();


        if (!result.success) {

            alert(
                "Could not save result. Please try again."
            );

            return;

        }


        window.location.href = "/result";

    }


    catch (error) {

        console.error(
            "Firebase error:",
            error
        );

        alert(
            "Database connection failed. Please try again."
        );

    }

}


loadQuestion();

</script>

</body>
</html>
