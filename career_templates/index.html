<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Career Advancement System</title>


    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #222;
        }


        .container {

            max-width: 900px;

            margin: 80px auto;

            padding: 40px;

            text-align: center;

            background: white;

            border-radius: 18px;

            box-shadow:
                0 8px 30px rgba(0,0,0,0.08);

        }


        h1 {

            font-size: 38px;

            margin-bottom: 15px;

        }


        p {

            font-size: 18px;

            color: #666;

            line-height: 1.6;

        }


        button {

            margin-top: 25px;

            padding: 14px 28px;

            border: none;

            border-radius: 10px;

            background: #2563eb;

            color: white;

            font-size: 16px;

            cursor: pointer;

        }


        button:hover {

            background: #1d4ed8;

        }

    </style>

</head>


<body>


    <div class="container">

        <h1>
            Career Advancement System
        </h1>


        <p>

            An automated system that analyzes
            student performance through an
            MCQ-based test and provides suitable
            career recommendations.

        </p>


        <button
            onclick="window.location.href='/student'">

            Start Career Test

        </button>

    </div>


</body>

</html>
